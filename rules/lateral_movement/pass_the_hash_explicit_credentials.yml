title: Potential Pass-the-Hash via Explicit Credential Logon With Suspicious Process
id: dd4dbcc0-ea8c-435e-94a4-4791c774df75
status: test
description: |
    Detects explicit credential logon attempts (Event ID 4648) originating from processes
    commonly used to relay stolen NTLM hashes for lateral movement, such as PsExec,
    WMIC, or Mimikatz's sekurlsa::pth. A 4648 event on the source host paired with a
    non-interactive tool as the calling process is a strong indicator of Pass-the-Hash.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_logon_explicit_creds.yml
author: detection-engineering-kb
date: 2026-07-19
tags:
    - attack.lateral-movement
    - attack.t1550.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4648
        ProcessName|endswith:
            - '\wmic.exe'
            - '\PsExec.exe'
            - '\PsExec64.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\mimikatz.exe'
    condition: selection
falsepositives:
    - Administrators legitimately using runas or credential-switching tools with alternate credentials
    - Scheduled tasks or scripts that explicitly pass service account credentials
level: medium
